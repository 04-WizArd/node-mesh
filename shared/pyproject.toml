[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nodemesh-common"
version = "1.0.0"
description = "Internal protocol shared by the NodeMesh coordinator and storage nodes (request signing, logging)."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
