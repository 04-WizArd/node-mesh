# Repository-wide tooling configuration. Each Django project keeps its own
# pytest.ini (they use different settings modules and run as separate suites).

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "DJ", "RUF"]
ignore = [
    "S101",    # assert is how pytest works
    "RUF012",  # Django class attributes (Meta, choices) are fine as-is
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S311", "S603", "B023"]
"**/test_settings.py" = ["S105", "S108"]
"**/settings.py" = ["S105"]
"scripts/**" = ["S603", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["nodemesh_common", "config", "accounts", "cluster", "files", "objects"]
