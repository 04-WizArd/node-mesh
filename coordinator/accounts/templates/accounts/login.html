{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Connexion</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert" role="alert">Identifiant ou mot de passe incorrect.</div>{% endif %}
    <label for="id_username">Nom d'utilisateur</label>
    <input type="text" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    <label for="id_password">Mot de passe</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Se connecter</button>
  </form>
  <p class="muted">Pas encore de compte ? <a href="{% url 'accounts:register' %}">Créer un compte</a></p>
</section>
{% endblock %}
